
<style>
*{box-sizing:border-box;margin:0;padding:0}
.tab-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tb{padding:6px 12px;font-size:12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);cursor:pointer;transition:all .15s;white-space:nowrap}
.tb.on{font-weight:500;border-width:1px}
.t0.on{background:#EEEDFE;color:#3C3489;border-color:#7F77DD}
.t1.on{background:#E1F5EE;color:#085041;border-color:#1D9E75}
.t2.on{background:#FAEEDA;color:#633806;border-color:#BA7517}
.t3.on{background:#FAECE7;color:#712B13;border-color:#D85A30}
.t4.on{background:#E6F1FB;color:#0C447C;border-color:#378ADD}
.t5.on{background:#FBEAF0;color:#72243E;border-color:#D4537E}
.t6.on{background:#EAF3DE;color:#27500A;border-color:#639922}
.t7.on{background:#F1EFE8;color:#444441;border-color:#888780}
.t8.on{background:#FCEBEB;color:#791F1F;border-color:#E24B4A}
.t9.on{background:#FAEEDA;color:#854F0B;border-color:#BA7517}
.sec-lbl{font-size:11px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.05em;padding:12px 0 6px}
.sec-lbl:first-child{padding-top:0}
.row{display:grid;grid-template-columns:180px 1fr 180px;gap:0;border-bottom:0.5px solid var(--color-border-tertiary);padding:7px 0;align-items:start}
.row:last-child{border-bottom:none}
.m-name{font-size:13px;font-weight:500;color:var(--color-text-primary);line-height:1.4;font-family:var(--font-mono);padding-right:12px}
.m-why{font-size:12px;color:var(--color-text-secondary);line-height:1.5;padding-right:12px}
.m-alert{font-size:11px;color:var(--color-text-secondary);line-height:1.5;font-family:var(--font-mono)}
.col-heads{display:grid;grid-template-columns:180px 1fr 180px;gap:0;padding:0 0 6px;border-bottom:0.5px solid var(--color-border-secondary);margin-bottom:4px}
.col-head{font-size:10px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.05em}
.meta-box{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px;font-size:12px;color:var(--color-text-secondary);line-height:1.6;margin-bottom:12px}
.meta-box strong{color:var(--color-text-primary);font-weight:500}
.stat-row{display:flex;gap:8px;margin-bottom:12px}
.stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:8px 12px;flex:1;text-align:center}
.stat-n{font-size:18px;font-weight:500;color:var(--color-text-primary)}
.stat-l{font-size:11px;color:var(--color-text-secondary);margin-top:2px}
.badge{font-size:10px;padding:2px 6px;border-radius:99px;white-space:nowrap;display:inline-block;margin-top:2px}
.b-must{background:#FAECE7;color:#993C1D}
.b-deep{background:#EEEDFE;color:#534AB7}
.b-good{background:#EAF3DE;color:#3B6D11}
</style>

<h2 class="sr-only">Complete data pipeline metrics reference across platforms and use cases</h2>

<div style="padding:12px 0 8px">
  <div style="font-size:15px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px">Data pipeline metrics — complete reference</div>
  <div style="font-size:12px;color:var(--color-text-secondary)">Every metric you need across platforms and use cases. Select a category to drill down.</div>
</div>

<div class="tab-row" id="tabs"></div>
<div class="stat-row" id="stats"></div>
<div class="meta-box" id="meta"></div>
<div class="col-heads">
  <div class="col-head">Metric</div>
  <div class="col-head">What it tells you / why it matters</div>
  <div class="col-head">Alert threshold pattern</div>
</div>
<div id="content"></div>

<script>
const cats=[
  {label:"Pipeline execution",cls:"t0",
   meta:"The foundation. Every pipeline regardless of platform must expose these. They answer: did it run, on time, correctly? The most important are the silent-failure detectors — row count drop and schema drift — because they catch problems that don't throw exceptions.",
   total:12,must:8,deep:3,good:1,
   sections:[
     {name:"Timing and SLA",rows:[
       ["pipeline_duration_p99","Whether your slowest runs will miss SLAs. Average hides tail latency completely.","Alert if > 2× p50 duration"],
       ["task_duration_per_stage","Pinpoints which stage is the bottleneck. Ingestion? Transform? Load?","Alert if stage > 80% of SLA budget","must"],
       ["sla_compliance_rate","% of runs completing within target window. Your primary reliability SLO.","Alert if < 98% over 7d rolling","must"],
       ["schedule_lag","Time between scheduled start and actual start. Detects resource starvation.","Alert if > 10 min for critical jobs"],
       ["time_since_last_successful_run","Detects stuck or silently failing pipelines that stopped running.","Alert if > 1.5× expected interval","must"],
     ]},
     {name:"Success and failure",rows:[
       ["task_success_rate","% of tasks completing without error. Baseline health metric.","Alert if < 99.5% over 24h","must"],
       ["task_failure_rate_by_stage","Which stage fails most. Guides where to invest in reliability.","Alert if any stage > 1% failure rate"],
       ["retry_rate","High retry rate signals flaky upstream dependencies even if jobs ultimately succeed.","Alert if > 5% of tasks require retry","must"],
       ["dag_run_state_distribution","Ratio of success/failure/running/queued. Detects queue buildup.","Alert if queued > 2× normal","deep"],
     ]},
     {name:"Data volume — the silent failure detectors",rows:[
       ["output_row_count_vs_baseline","Most critical metric. A job completing with 0 rows is worse than a crash.","Alert if < 80% or > 120% of 7d avg","must"],
       ["null_rate_per_column","Schema changes from upstream often introduce unexpected nulls.","Alert if critical columns > 0.1% null","must"],
       ["duplicate_row_rate","ETL bugs often cause double-counting especially on retries without idempotency.","Alert if > 0.01% duplicates","must"],
     ]},
   ]
  },
  {label:"Data quality",cls:"t1",
   meta:"The difference between a data engineer and a production data engineer. Most pipelines test code correctness but not data correctness. These metrics catch schema drift, distribution shift, and referential integrity failures before they corrupt your ML models.",
   total:14,must:9,deep:4,good:1,
   sections:[
     {name:"Schema integrity",rows:[
       ["schema_drift_detection","New/removed/renamed columns break downstream transformations silently.","Fail pipeline on any unexpected schema change","must"],
       ["column_type_mismatch_rate","Upstream type changes — int becomes string — break feature engineering.","Alert on any type mismatch in key columns","must"],
       ["unexpected_column_count","Quick schema health check. Column count should be stable.","Alert if ± 2 columns from expected","must"],
       ["new_column_detection","New upstream columns may contain valuable signal you are missing.","Log and notify, don't fail pipeline","good"],
     ]},
     {name:"Statistical distribution",rows:[
       ["feature_distribution_ks_statistic","KS test detects distribution shift in continuous features.","Alert if p-value < 0.05","must"],
       ["feature_psi_score","Population Stability Index — industry standard for financial models.","Alert if PSI > 0.2 (moderate shift)","must"],
       ["mean_and_stddev_drift","Simple but effective for catching gradual drift in numeric features.","Alert if mean shifts > 2σ from baseline","must"],
       ["categorical_frequency_shift","New categories or disappearing categories signal upstream changes.","Alert if any category frequency changes > 20%","deep"],
       ["outlier_rate_per_feature","Sudden spike in outliers often signals upstream data quality issue.","Alert if > 3× baseline outlier rate","deep"],
     ]},
     {name:"Completeness and consistency",rows:[
       ["completeness_score","% of expected records received. Critical for time-windowed pipelines.","Alert if < 95% of expected records","must"],
       ["referential_integrity_violation_rate","Join keys that don't match across tables. Causes silent drops.","Alert if > 0.1% join key mismatches","must"],
       ["data_freshness_seconds","How old is the newest record. Detects upstream ingestion lag.","Alert if > 1.5× expected freshness SLA","must"],
       ["late_arriving_data_rate","% of records arriving after their expected window.","Alert if > 2% of records are late","deep"],
       ["deduplication_effectiveness","After dedup step: are duplicates actually removed?","Alert if duplicate rate post-dedup > 0%","must"],
     ]},
   ]
  },
  {label:"ML-specific pipeline",cls:"t2",
   meta:"These metrics only matter if your pipeline feeds an ML system. Point-in-time correctness and training-serving skew are the two most dangerous failure modes in ML pipelines — they cause your model to appear accurate in offline evaluation and then fail silently in production.",
   total:13,must:8,deep:4,good:1,
   sections:[
     {name:"Feature store integrity",rows:[
       ["training_serving_skew","Feature values used at training vs serving time should match exactly. If they don't, your model trains on different data than it sees in production.","Alert if feature mean differs > 5% between training and serving","must"],
       ["point_in_time_correctness_violations","Records where future data leaked into the training example. The most dangerous ML data bug.","Alert on any violation — this is a hard block","must"],
       ["feature_freshness_at_serving","How stale are online features at inference time. Stale features kill model quality.","Alert if features > target freshness SLA","must"],
       ["feature_coverage_rate","% of serving requests where all features are available. Missing features force fallback logic.","Alert if < 99% feature availability","must"],
       ["feature_value_range_violations","Features outside expected min/max at serving time signal upstream change.","Alert if > 0.1% out-of-range values","deep"],
     ]},
     {name:"Training data quality",rows:[
       ["label_distribution","Class imbalance shifts destroy model calibration silently.","Alert if minority class rate changes > 10% from baseline","must"],
       ["label_lag_days","Time between event and label assignment. Critical for fraud and churn models.","Track distribution — alert if median lag increases","must"],
       ["training_set_size_vs_baseline","Sudden drop in training data = worse model next cycle.","Alert if < 85% of expected training rows","must"],
       ["class_weight_drift","If using class weights, changes in label distribution should trigger weight recalculation.","Recompute weights if distribution shifts > 5%","deep"],
     ]},
     {name:"Experiment reproducibility",rows:[
       ["data_version_hash","Hash of training dataset. Same hash = reproducible experiment.","Store with every model artifact","must"],
       ["feature_pipeline_version","Which version of feature logic generated this dataset.","Store with every model artifact","must"],
       ["random_seed_documented","Reproducibility requires pinned seeds for all random operations.","Fail experiment registration if seed not set","deep"],
       ["dataset_split_overlap_rate","Train/val/test leakage. Should be 0% for time-series splits.","Alert on any overlap","good"],
     ]},
   ]
  },
  {label:"Airflow",cls:"t3",
   meta:"Airflow is the most common orchestrator you will encounter. These metrics are exposed via the Airflow metrics API and StatsD integration. The most important ones are DAG file parsing time (often ignored until it causes the scheduler to fall behind) and task slot utilization.",
   total:11,must:7,deep:3,good:1,
   sections:[
     {name:"Scheduler health",rows:[
       ["dag_processing_total_parse_time","Time to parse all DAG files. High parse time delays scheduling for all DAGs.","Alert if > 30s (indicates too many or complex DAGs)","must"],
       ["scheduler_heartbeat","Interval between scheduler heartbeats. Goes to 0 if scheduler crashes.","Alert if heartbeat gap > 2× configured interval","must"],
       ["scheduler_tasks_starving","Tasks that are queued but not getting executor slots.","Alert if > 0 tasks starving for > 5 min","must"],
       ["dag_import_errors","Python errors in DAG files prevent scheduling silently.","Alert on any import error","must"],
     ]},
     {name:"Executor and task",rows:[
       ["executor_open_slots","Available executor capacity. Going to 0 means new tasks queue.","Alert if < 10% of total slots available","must"],
       ["task_slot_utilization","% of executor slots in use. Consistently > 90% means you need more workers.","Alert if > 90% for > 30 min","must"],
       ["zombie_task_count","Tasks marked running but with no active heartbeat.","Alert on any zombie task","must"],
       ["pool_open_slots_per_pool","Airflow pools limit concurrent tasks per resource. Pool exhaustion queues tasks.","Alert if any critical pool at 0 open slots","deep"],
     ]},
     {name:"DAG performance",rows:[
       ["dag_run_duration_p95","P95 run time per DAG. Track trends — slow creep indicates data volume growth.","Alert if > 2× 30d p95 baseline","deep"],
       ["task_failures_by_dag_and_task","Which DAG + task combination fails most.","Alert if any task fails > 3× in 24h","deep"],
       ["catchup_dag_run_count","How many historical runs are being caught up. High count means scheduler debt.","Alert if > 10 catchup runs in progress","good"],
     ]},
   ]
  },
  {label:"Apache Spark",cls:"t4",
   meta:"Spark metrics are the most complex in this list because Spark exposes hundreds of metrics across drivers, executors, and stages. Focus on the ones that tell you whether your job is compute-bound, memory-bound, or I/O-bound — that diagnosis drives every optimization decision.",
   total:14,must:8,deep:5,good:1,
   sections:[
     {name:"Job and stage",rows:[
       ["job_duration_p99","Overall job health. P99 catches the tail runs that miss SLAs.","Alert if > 1.5× 7d p99 baseline","must"],
       ["stage_duration_distribution","Which stage takes longest. The bottleneck stage is your optimization target.","Alert if any stage > 60% of total job time","must"],
       ["task_failure_rate_per_stage","Failed tasks cause retries and extend job duration.","Alert if > 5% task failure rate","must"],
       ["stage_retry_count","Stages with multiple retries indicate flaky data or resource contention.","Alert if any stage retries > 2×","must"],
     ]},
     {name:"Memory and spill",rows:[
       ["executor_memory_used_vs_allocated","Memory pressure causes spill to disk which kills performance.","Alert if > 85% memory utilization","must"],
       ["shuffle_spill_to_disk_bytes","Disk spill means in-memory shuffle failed. Indicates partitioning issues.","Alert if spill > 10% of shuffle read bytes","must"],
       ["gc_time_fraction","JVM GC time as % of task time. High GC = memory pressure.","Alert if GC > 10% of task CPU time","must"],
       ["peak_execution_memory_per_task","Helps right-size executor memory allocation.","Use to set executor.memory correctly","deep"],
     ]},
     {name:"Shuffle and I/O",rows:[
       ["shuffle_read_write_bytes","Large shuffle indicates too-wide joins or poor partitioning.","Alert if shuffle > 5× input data size","must"],
       ["data_skew_ratio","Max task duration / median task duration. High skew = one partition doing all the work.","Alert if max/median > 5×","deep"],
       ["shuffle_partition_count","Too few partitions → data skew. Too many → task overhead dominates.","Tune to 200-400MB per partition","deep"],
       ["executor_cpu_time_vs_run_time","Low ratio means executor is waiting on I/O or GC, not computing.","Alert if CPU/run time < 70%","deep"],
       ["locality_level_distribution","PROCESS_LOCAL is fastest. RACK_LOCAL and ANY indicate data placement issues.","Alert if ANY locality > 20% of tasks","good"],
     ]},
   ]
  },
  {label:"Kafka / streaming",cls:"t5",
   meta:"Streaming pipeline metrics require a fundamentally different mental model from batch. The key question is always: is your consumer keeping up with your producer? Consumer lag is the single most important metric and it is often the only one teams monitor. That is a mistake — lag tells you there is a problem but not why.",
   total:12,must:7,deep:4,good:1,
   sections:[
     {name:"Consumer lag — the primary health signal",rows:[
       ["consumer_group_lag_per_partition","Messages produced but not yet consumed. Growing lag = consumer falling behind.","Alert if lag > 10k messages or > SLA threshold","must"],
       ["max_lag_across_partitions","Worst-case lag. One slow partition affects downstream completeness.","Alert if any partition lag > 2× average lag","must"],
       ["lag_growth_rate","Is lag growing, stable, or shrinking? Growing lag means consumer is undersized.","Alert if lag grows for > 5 consecutive minutes","must"],
       ["consumer_throughput_vs_producer_throughput","Consumer must match producer. If producer > consumer, lag grows indefinitely.","Alert if consumer throughput < 90% of producer throughput","must"],
     ]},
     {name:"Broker and topic health",rows:[
       ["under_replicated_partitions","Partitions without full ISR. Risk of data loss if broker fails.","Alert on any under-replicated partition","must"],
       ["offline_partitions_count","Partitions with no leader. Data unavailable.","Alert immediately on any offline partition","must"],
       ["messages_in_per_sec_per_topic","Topic throughput. Sudden drop = upstream producer issue.","Alert if < 50% of baseline","must"],
       ["broker_disk_usage_per_topic","Retention management. Full disk loses messages.","Alert if > 80% disk on any broker","deep"],
     ]},
     {name:"Processing performance",rows:[
       ["end_to_end_latency_p99","Time from message produced to message processed. Your streaming SLO.","Alert if > target SLA","deep"],
       ["deserialization_error_rate","Schema changes cause deserialization failures. Silent message drops.","Alert on any deserialization error","deep"],
       ["rebalance_frequency","Frequent rebalances cause processing pauses and lag spikes.","Alert if rebalances > 1 per hour","deep"],
       ["commit_failure_rate","Failed offset commits cause reprocessing. Risk of duplicate records.","Alert if > 0.01% commit failures","good"],
     ]},
   ]
  },
  {label:"dbt / transformation",cls:"t6",
   meta:"dbt metrics are underused but extremely valuable for teams doing SQL-based transformations in a data warehouse. The most important are model run time trends — slow models indicate data volume growth that will eventually cause SLA misses — and freshness checks which tell you whether source data arrived on time.",
   total:10,must:6,deep:3,good:1,
   sections:[
     {name:"Model execution",rows:[
       ["model_run_duration_p95","Per-model run time trends. Creeping increase signals data volume growth.","Alert if model duration > 2× 30d baseline","must"],
       ["model_failure_rate","% of models failing in a dbt run.","Alert if any model fails","must"],
       ["model_rows_created_vs_baseline","Row count per model. Sudden drop = upstream data issue.","Alert if < 80% of 7d average rows","must"],
       ["full_refresh_vs_incremental_performance","Incremental models should be significantly faster than full refresh.","Alert if incremental approaches full refresh time","deep"],
     ]},
     {name:"Source freshness",rows:[
       ["source_freshness_status","Is source data newer than expected? dbt source freshness checks this.","Fail run if source freshness > SLA","must"],
       ["source_loaded_at_lag","Time between data event and loading to warehouse.","Alert if lag > 2× expected ingestion window","must"],
       ["snapshot_row_drift","For dbt snapshots: unexpected changes in SCD rows indicate upstream changes.","Alert if > 5% of snapshot rows change in one run","deep"],
     ]},
     {name:"Test results",rows:[
       ["test_failure_rate_by_model","dbt tests are your data quality gates. Failures should block downstream.","Fail run on any test failure in critical models","must"],
       ["unique_key_violations","Primary key uniqueness violations indicate ETL bugs.","Alert on any violation — hard block","must"],
       ["not_null_test_failures","Critical columns going null.","Alert on any failure in tier-1 models","good"],
     ]},
   ]
  },
  {label:"Kubernetes / EKS pipelines",cls:"t7",
   meta:"When running ML pipelines on Kubernetes — Airflow KubernetesExecutor, Kubeflow Pipelines, Spark on EKS — you have an additional infrastructure layer that can cause pipeline failures independent of data or logic issues. These metrics live in your cluster observability stack.",
   total:11,must:7,deep:3,good:1,
   sections:[
     {name:"Pod and job health",rows:[
       ["pod_failure_rate_by_pipeline","Pods failing due to OOM, node eviction, or image pull errors.","Alert if > 1% pod failure rate","must"],
       ["oom_killed_container_count","OOM kills indicate memory limits set too low for data volume.","Alert on any OOM kill in pipeline pods","must"],
       ["job_completion_rate","Kubernetes Jobs: % completing vs failing.","Alert if < 99% completion rate","must"],
       ["pod_pending_duration","Time pods spend in Pending state waiting for resources.","Alert if pending > 5 min for critical jobs","must"],
     ]},
     {name:"Resource utilization",rows:[
       ["cpu_throttling_rate_per_pod","CPU throttled pods run slower, extending pipeline duration silently.","Alert if throttling > 10% of CPU time","must"],
       ["memory_utilization_vs_limit","Pods approaching limit are at risk of OOM kill.","Alert if > 85% of memory limit","must"],
       ["node_pressure_conditions","MemoryPressure/DiskPressure on nodes causes evictions.","Alert on any node pressure condition","must"],
       ["persistent_volume_usage","Spark shuffle PVCs filling up causes job failures.","Alert if PVC > 80% capacity","deep"],
     ]},
     {name:"Scheduling",rows:[
       ["gang_scheduling_wait_time","For YuniKorn/Volcano: time waiting for all pods to be co-scheduled.","Alert if wait > 10 min","deep"],
       ["spot_interruption_rate","Spot nodes being reclaimed during pipeline execution.","Track trend — if > 5% of runs interrupted, review instance types","deep"],
       ["node_autoscaler_latency","Time for Karpenter to provision new nodes for burst workloads.","Alert if provisioning > 3 min","good"],
     ]},
   ]
  },
  {label:"Cost and efficiency",cls:"t8",
   meta:"Often completely absent from pipeline monitoring until the cloud bill arrives. Cost metrics are the bridge between engineering and business stakeholders. At mid-size AI companies, cost-per-run metrics often directly influence architectural decisions and are specifically asked about in system design interviews.",
   total:9,must:5,deep:3,good:1,
   sections:[
     {name:"Compute cost",rows:[
       ["cost_per_pipeline_run","Trend over time. Growing cost with stable data volume = inefficiency.","Alert if cost increases > 20% week-over-week","must"],
       ["spot_vs_on_demand_usage_ratio","% of compute running on Spot. Higher is better for cost.","Target > 60% Spot for fault-tolerant workloads","must"],
       ["idle_executor_time_fraction","Executors sitting idle waiting for data. Wasted spend.","Alert if > 20% idle time","must"],
       ["cost_per_processed_row","Normalizes cost by data volume. Detects efficiency regression.","Track trend — alert if increases > 15% month-over-month","must"],
     ]},
     {name:"Storage cost",rows:[
       ["intermediate_storage_bytes","Temp files and shuffle data that should be cleaned up post-run.","Alert if intermediate storage grows unbounded","must"],
       ["data_retention_policy_compliance","Data kept longer than policy wastes storage and creates compliance risk.","Audit weekly — alert on policy violations","deep"],
       ["data_compression_ratio","Poorly compressed data costs more to store and slower to read.","Alert if compression ratio < 3× for Parquet","deep"],
     ]},
     {name:"Efficiency",rows:[
       ["compute_to_output_ratio","Compute hours per GB of useful output. Efficiency metric.","Track trend","deep"],
       ["cache_hit_rate_for_repeated_stages","Airflow and dbt can cache unchanged stages. High hit rate = lower cost.","Target > 40% cache hit on incremental runs","good"],
     ]},
   ]
  },
  {label:"Healthcare & finance",cls:"t9",
   meta:"Regulated industry pipelines have mandatory metrics beyond standard data quality. Healthcare requires PHI audit trails and de-identification validation. Finance requires model risk governance metrics and point-in-time correctness validation. These are compliance requirements, not optional optimizations.",
   total:11,must:8,deep:2,good:1,
   sections:[
     {name:"Healthcare — HIPAA compliance",rows:[
       ["phi_detected_in_output","PHI in pipeline output is a HIPAA violation. Must be zero.","Hard block on any PHI in model training data","must"],
       ["de_identification_coverage_rate","% of PHI fields successfully de-identified before storage.","Alert if < 100% — must be perfect","must"],
       ["access_log_completeness","Audit trail of who accessed what data and when. HIPAA requirement.","Alert if any data access without audit record","must"],
       ["data_use_agreement_compliance","Training data must be covered by DUA. Track expiry dates.","Alert 30 days before DUA expiration","must"],
       ["phi_re_identification_risk_score","Statistical risk that de-identified data can be re-identified.","Alert if k-anonymity < 5","deep"],
     ]},
     {name:"Finance — model risk governance",rows:[
       ["backtesting_look_ahead_bias_score","Features using future data. Must be zero for valid backtesting.","Hard block — any look-ahead bias fails validation","must"],
       ["training_data_vintage_distribution","How old is the training data? Stale data degrades model performance.","Alert if > 20% of training data > 2 years old","must"],
       ["feature_stability_index_per_feature","PSI per feature over time. Required for SR 11-7 model validation.","Alert if any feature PSI > 0.25","must"],
       ["adverse_action_reason_code_coverage","% of negative model decisions with valid reason codes. FCRA requirement.","Alert if < 100% coverage","must"],
       ["model_performance_by_demographic_segment","Fairness metric. Required for credit and employment models.","Alert if accuracy gap > 5% across protected groups","deep"],
       ["ground_truth_label_lag_distribution","Fraud labels arrive 48h late. Track lag to calibrate evaluation windows.","Alert if median lag increases > 20%","good"],
     ]},
   ]
  },
];

let cur=0;
function showTab(i){cur=i;document.querySelectorAll('.tb').forEach((b,j)=>b.classList.toggle('on',j===i));render();}
function render(){
  const c=cats[cur];
  document.getElementById('meta').innerHTML=`<strong>${c.label}:</strong> ${c.meta}`;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat-n">${c.total}</div><div class="stat-l">Total metrics</div></div>
    <div class="stat"><div class="stat-n">${c.must}</div><div class="stat-l">Must know</div></div>
    <div class="stat"><div class="stat-n">${c.deep}</div><div class="stat-l">Go deep</div></div>
    <div class="stat"><div class="stat-n">${c.sections.length}</div><div class="stat-l">Categories</div></div>`;
  let html='';
  for(const sec of c.sections){
    html+=`<div class="sec-lbl">${sec.name}</div>`;
    for(const r of sec.rows){
      const depth=r[3]||'must';
      const bc=depth==='must'?'b-must':depth==='deep'?'b-deep':'b-good';
      const bl=depth==='must'?'must know':depth==='deep'?'go deep':'good to have';
      html+=`<div class="row"><div class="m-name">${r[0]}<br><span class="badge ${bc}">${bl}</span></div><div class="m-why">${r[1]}</div><div class="m-alert">${r[2]}</div></div>`;
    }
  }
  document.getElementById('content').innerHTML=html;
}
const tabsEl=document.getElementById('tabs');
tabsEl.innerHTML=cats.map((c,i)=>`<button class="tb ${c.cls}${i===0?' on':''}" onclick="showTab(${i})">${c.label}</button>`).join('');
render();
</script>
