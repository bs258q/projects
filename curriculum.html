<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curriculum — DevPath</title>
<style>
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --bg: #0a0a0a;
  --surface: #111;
  --surface-2: #161616;
  --border: #222;
  --border-2: #2e2e2e;
  --text: #ededed;
  --text-2: #888;
  --text-3: #555;
  --green: #1D9E75;
  --border-primary: #3a3a3a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-sans); line-height: 1.6; }
a { color: inherit; text-decoration: none; }

.site-nav { display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; height: 56px; border-bottom: 0.5px solid var(--border); position: sticky; top: 0; background: rgba(10,10,10,.92); backdrop-filter: blur(12px); z-index: 100; }
.nav-logo { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.nav-logo span { color: var(--green); }
.nav-links { display: flex; gap: 4px; }
.nav-link { padding: 6px 14px; border-radius: 20px; font-size: 13px; color: var(--text-2); transition: all .15s; }
.nav-link:hover, .nav-link.active { color: var(--text); background: var(--surface-2); }
.nav-link.active { font-weight: 500; }

.page-header { padding: 2.5rem 2rem 1.5rem; border-bottom: 0.5px solid var(--border); max-width: 960px; margin: 0 auto; }
.page-header h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 6px; }
.page-header p { font-size: 14px; color: var(--text-2); }

.content-wrap { max-width: 960px; margin: 0 auto; padding: 1.5rem 2rem 4rem; }

/* track nav */
.track-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1.5rem; }
.track-btn { padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 0.5px solid var(--border-2); background: var(--surface); color: var(--text-2); font-weight: 400; transition: all .15s; }
.track-btn:hover, .track-btn.active { background: var(--surface-2); color: var(--text); border-color: var(--border-primary); }
.track-btn.active { font-weight: 500; }

/* legend */
.legend { display: flex; gap: 16px; margin-bottom: 1rem; }
.leg { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-2); }
.leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* track header */
.track-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 1rem; border-bottom: 0.5px solid var(--border); padding-bottom: 0.75rem; }
.track-title { font-size: 18px; font-weight: 500; }
.track-sub { font-size: 13px; color: var(--text-2); }

/* section label */
.section-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); margin: 1.25rem 0 0.5rem; }

/* grid */
.c-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }

/* cards */
.card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 10px; padding: 14px; cursor: pointer; transition: border-color .15s, background .1s; }
.card:hover { border-color: var(--border-2); background: var(--surface-2); }
.card.open { border-color: var(--border-primary); }
.card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.card-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.card-dot.beg { background: #1D9E75; }
.card-dot.int { background: #BA7517; }
.card-dot.adv { background: #D4537E; }
.card-name { font-size: 14px; font-weight: 500; }
.card-tag { font-size: 11px; color: var(--text-2); margin-bottom: 8px; }
.card-body { font-size: 12.5px; color: var(--text-2); line-height: 1.6; display: none; }
.card.open .card-body { display: block; }
.concepts { list-style: none; padding: 0; }
.concepts li { padding: 3px 0; border-bottom: 0.5px solid var(--border); }
.concepts li:last-child { border-bottom: none; }
.concepts li::before { content: "→ "; color: var(--text-3); }
.yt-link { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; font-size: 12px; font-weight: 500; color: #ff4444; }
.yt-link:hover { color: #cc0000; }

footer { border-top: 0.5px solid var(--border); padding: 1.5rem 2rem; text-align: center; font-size: 12.5px; color: var(--text-3); }
</style>
</head>
<body>

<nav class="site-nav">
  <a class="nav-logo" href="index.html"><span>Dev</span>Path</a>
  <div class="nav-links">
    <a class="nav-link" href="index.html">Home</a>
    <a class="nav-link active" href="curriculum.html">Curriculum</a>
    <a class="nav-link" href="projects.html">Projects</a>
  </div>
</nav>

<div class="page-header">
  <h1>Curriculum</h1>
  <p>Concept cards for every track — click any card to expand the key topics you need to know</p>
</div>

<div class="content-wrap">
  <div class="track-nav" id="trackNav"></div>
  <div class="legend">
    <div class="leg"><span class="leg-dot" style="background:#1D9E75"></span>Beginner</div>
    <div class="leg"><span class="leg-dot" style="background:#BA7517"></span>Intermediate</div>
    <div class="leg"><span class="leg-dot" style="background:#D4537E"></span>Advanced</div>
  </div>
  <div id="trackContent"></div>
</div>

<footer>DevPath &mdash; DevOps, MLOps &amp; AI Engineering learning platform</footer>

        { name: "Security Groups & NACLs", tag: "Security", level: "beg", youtube: "https://www.youtube.com/watch?v=JWoNu2Mtpdg", concepts: ["Stateful SGs vs stateless NACLs", "Inbound & outbound rules", "Port/IP-based allow/deny rules", "NACL rule evaluation order (priority numbers)", "Layering SGs with NACLs for defense-in-depth"] },

        { name: "Advanced Pipelines", tag: "CI/CD", level: "int", youtube: "https://www.youtube.com/watch?v=R8_veQiYBjI", concepts: ["Reusable workflows (workflow_call)", "Composite actions", "Caching dependencies (actions/cache)", "Build & push Docker images to ECR", "Deploying to ECS/EKS from Actions", "OIDC for keyless AWS auth"] },
      ]
    }

    sub: "Programming foundation",
    sections: {

        { name: "Python Fundamentals", tag: "Language", level: "beg", youtube: "https://www.youtube.com/playlist?list=PL-osiE80TeTskrapNbzXhwoFUiLCjGgY7", concepts: ["Data types: str, int, list, dict, set, tuple", "Control flow: if/elif/else, for, while", "Functions, args, kwargs, *args", "Classes & basic OOP", "File I/O & exception handling"] },
        { name: "Intermediate Python", tag: "Libraries", level: "int", youtube: "https://www.youtube.com/playlist?list=PL-osiE80TeTskrapNbzXhwoFUiLCjGgY7", concepts: ["List comprehensions & generators", "Decorators & context managers", "Virtual environments (venv, conda)", "requests, boto3, os, pathlib, logging", "asyncio basics for async code"] },
      ]
    }
  },
  "Data Science": {
    sub: "Data analysis & visualization",
    sections: {
      "Foundation": [
        { name: "Data Wrangling", tag: "Analysis", level: "beg", youtube: "https://www.youtube.com/watch?v=2uvysYbKdjM", concepts: ["pandas: DataFrames, Series, groupby", "numpy: arrays, broadcasting, vectorization", "Data cleaning: nulls, outliers, dtypes", "Merging, joining, reshaping data", "Reading CSV, JSON, Parquet files"] },
        { name: "Visualization & Stats", tag: "EDA", level: "beg", youtube: "https://www.youtube.com/playlist?list=PL-osiE80TeTvipOqomVEeZ1HRrcEvtZB_", concepts: ["matplotlib & seaborn for EDA", "Histograms, box plots, scatter plots", "Descriptive stats: mean, median, std, IQR", "Correlation & basic hypothesis testing", "Plotly for interactive charts"] },
        { name: "SQL for Data", tag: "Databases", level: "int", youtube: "https://www.youtube.com/playlist?list=PLUaB-1hjhk8GT6N5ne2qpf603sF26m2PW", concepts: ["SELECT, JOIN (inner/left/right/full)", "GROUP BY, HAVING, subqueries", "Window functions: ROW_NUMBER, RANK, LAG", "CTEs for readable queries", "Connecting Python to SQL (SQLAlchemy, psycopg2)"] },

    }

  "Machine Learning": {
    sub: "ML algorithms & modeling",
    sections: {
      "Core ML": [
        { name: "ML Fundamentals", tag: "Concepts", level: "beg", youtube: "https://www.youtube.com/watch?v=Gv9_4yMHFhI", concepts: ["Supervised vs unsupervised vs RL", "Train/val/test splits & cross-validation", "Bias-variance tradeoff", "Overfitting & regularization (L1, L2)", "Evaluation: accuracy, precision, recall, F1, AUC-ROC"] },
        { name: "Classic Algorithms", tag: "Algorithms", level: "beg", youtube: "https://www.youtube.com/playlist?list=PLblh5JKOoLUIcdlgu78MnlATeyx4cEVeR", concepts: ["Linear & logistic regression", "Decision trees, random forests, XGBoost", "K-means clustering, DBSCAN", "K-nearest neighbors", "Support vector machines (SVM)"] },
        { name: "Deep Learning", tag: "Neural Networks", level: "int", youtube: "https://www.youtube.com/playlist?list=PLZZWrBYkx7Otcjr3eCLZDCgfpqnxMY29s", concepts: ["Neural nets: layers, activations, backprop", "PyTorch or TensorFlow basics", "CNNs for image tasks", "RNNs & LSTMs for sequences", "Transfer learning with pretrained models"] },
        { name: "Feature Engineering", tag: "Modeling", level: "int", youtube: "https://www.youtube.com/watch?v=6WDFfaL9iz4", concepts: ["Encoding categoricals (OHE, label)", "Scaling: StandardScaler, MinMaxScaler", "Feature selection: variance, importance, SHAP", "Handling class imbalance (SMOTE, weights)", "Pipeline with sklearn Pipeline API"] },
      ]
    }
  },
  "MLOps": {
    sub: "Production ML systems",
    sections: {
      "ML Lifecycle": [
        { name: "Experiment Tracking", tag: "Tracking", level: "int", youtube: "https://www.youtube.com/watch?v=RnYa3QsXRAc", concepts: ["MLflow: runs, experiments, metrics logging", "Weights & Biases (wandb)", "Model registry: stages (staging to prod)", "Artifact versioning & lineage", "DVC for data version control"] },

  "AI Engineer": {

        { name: "LLM Fine-tuning", tag: "Customization", level: "adv", youtube: "https://www.youtube.com/watch?v=bZcKYiwtw1I", concepts: ["When to fine-tune vs prompt engineer", "LoRA & QLoRA: parameter-efficient tuning", "Supervised fine-tuning (SFT) datasets", "RLHF & DPO for alignment", "Unsloth for fast fine-tuning on consumer GPUs"] },
        { name: "AI Agents & Frameworks", tag: "Agentic AI", level: "adv", youtube: "https://www.youtube.com/watch?v=DtW_Lc9hYoU", concepts: ["Tool use / function calling", "ReAct pattern: reason + act loops", "LangChain, LlamaIndex, AutoGen", "Memory: short-term (context), long-term (vector store)", "Multi-agent coordination & orchestration", "Observability: tracing LLM calls (LangSmith, Arize)"] },
      ]
    }
  }
};

const trackNav = document.getElementById('trackNav');
const trackContent = document.getElementById('trackContent');

function el(tag, className) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  return e;
}

function renderTrack(key) {
  trackNav.querySelectorAll('.track-btn').forEach(b => b.classList.toggle('active', b.dataset.t === key));

  const track = tracks[key];
  const frag = document.createDocumentFragment();

  const header = el('div', 'track-header');
  const titleEl = el('span', 'track-title');
  titleEl.textContent = key;
  const subEl = el('span', 'track-sub');
  subEl.textContent = track.sub;
  header.append(titleEl, subEl);
  frag.append(header);

  const sectionKeys = Object.keys(track.sections);
  for (const sectionName of sectionKeys) {
    if (sectionKeys.length > 1) {
      const label = el('div', 'section-label');
      label.textContent = sectionName;
      frag.append(label);
    }

    const grid = el('div', 'c-grid');
    for (const card of track.sections[sectionName]) {
      const cardEl = el('div', 'card');

      const top = el('div', 'card-top');
      const dot = el('span', `card-dot ${card.level}`);
      const nameEl = el('span', 'card-name');
      nameEl.textContent = card.name;
      top.append(dot, nameEl);

      const tagEl = el('div', 'card-tag');
      tagEl.textContent = card.tag;

      const body = el('div', 'card-body');
      const ul = el('ul', 'concepts');
      for (const concept of card.concepts) {
        const li = document.createElement('li');
        li.textContent = concept;
        ul.append(li);
      }
      body.append(ul);

      if (card.youtube) {
        const ytLink = document.createElement('a');
        ytLink.className = 'yt-link';
        ytLink.href = card.youtube;
        ytLink.target = '_blank';
        ytLink.rel = 'noopener noreferrer';
        ytLink.textContent = '▶ Watch on YouTube';
        ytLink.addEventListener('click', e => e.stopPropagation());
        body.append(ytLink);
      }

      cardEl.append(top, tagEl, body);
      cardEl.addEventListener('click', () => cardEl.classList.toggle('open'));
      grid.append(cardEl);
    }
    frag.append(grid);
  }

  trackContent.replaceChildren(frag);
}

for (const key of Object.keys(tracks)) {
  const btn = el('button', 'track-btn');
  btn.dataset.t = key;
  btn.textContent = key;
  btn.addEventListener('click', () => renderTrack(key));
  trackNav.append(btn);
}

renderTrack(Object.keys(tracks)[0]);
</script>

</body>
</html>
